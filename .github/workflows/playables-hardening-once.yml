name: Apply YouTube Playables hardening once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[apply-playables-hardening]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harden YouTube lifecycle and audio
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # --- First campaign engine -------------------------------------------------
          p = Path('game-v3.js')
          t = p.read_text(encoding='utf-8')
          t = replace_once(t,
              "  let muted = false;\n  let bannerTimeout = 0;",
              "  let muted = false;\n  let bannerTimeout = 0;\n  let frameId = 0;\n  let platformPaused = false;\n  let pausedByPlatform = false;",
              'game-v3 lifecycle vars')
          t = replace_once(t,
              "  function sound(kind) {\n    if (muted) return;",
              "  function sound(kind) {\n    if (muted || platformPaused || (window.PulsePlatform?.inPlayables && !window.PulsePlatform.systemAudioEnabled)) return;",
              'game-v3 sound guard')
          t = replace_once(t,
              "  function frame(now) {\n    const dt = Math.min(.033, (now - lastTime) / 1000 || 0);\n    lastTime = now;\n    update(dt);\n    draw();\n    requestAnimationFrame(frame);\n  }",
              "  function frame(now) {\n    if (platformPaused) { frameId = 0; return; }\n    const dt = Math.min(.033, (now - lastTime) / 1000 || 0);\n    lastTime = now;\n    update(dt);\n    draw();\n    frameId = requestAnimationFrame(frame);\n  }\n\n  function handlePlatformPause() {\n    platformPaused = true;\n    pausedByPlatform = state.running && !state.paused;\n    if (pausedByPlatform) togglePause(true);\n    if (frameId) { cancelAnimationFrame(frameId); frameId = 0; }\n    if (audioCtx?.state === 'running') audioCtx.suspend().catch(() => {});\n  }\n\n  function handlePlatformResume() {\n    platformPaused = false;\n    if (pausedByPlatform) togglePause(false);\n    pausedByPlatform = false;\n    lastTime = performance.now();\n    if (audioCtx && !muted && (!window.PulsePlatform?.inPlayables || window.PulsePlatform.systemAudioEnabled) && audioCtx.state === 'suspended') {\n      audioCtx.resume().catch(() => {});\n    }\n    if (!frameId) frameId = requestAnimationFrame(frame);\n  }",
              'game-v3 frame loop')
          t = replace_once(t,
              "  document.addEventListener('visibilitychange', () => {\n    if (document.hidden && state.running && !state.paused) togglePause(true);\n  });",
              "  window.addEventListener('pulse:system-pause', handlePlatformPause);\n  window.addEventListener('pulse:system-resume', handlePlatformResume);\n  window.addEventListener('pulse:system-audio', event => {\n    const enabled = Boolean(event.detail?.enabled);\n    if (!enabled && audioCtx?.state === 'running') audioCtx.suspend().catch(() => {});\n    else if (enabled && !platformPaused && !muted && audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});\n  });",
              'game-v3 visibility listener')
          t = replace_once(t,
              "  requestAnimationFrame(frame);\n})();",
              "  frameId = requestAnimationFrame(frame);\n})();",
              'game-v3 initial frame')
          p.write_text(t, encoding='utf-8')

          # --- Final act engine ------------------------------------------------------
          p = Path('final-act.js')
          t = p.read_text(encoding='utf-8')
          t = replace_once(t,
              "  let audioCtx = null;\n  let fxMuted = false;",
              "  let audioCtx = null;\n  let fxMuted = false;\n  let frameId = 0;\n  let platformPaused = false;\n  let pausedByPlatform = false;",
              'final lifecycle vars')
          t = replace_once(t,
              "  function sound(k){if(fxMuted)return;",
              "  function sound(k){if(fxMuted||platformPaused||(window.PulsePlatform?.inPlayables&&!window.PulsePlatform.systemAudioEnabled))return;",
              'final sound guard')
          t = replace_once(t,
              "  function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame);}",
              "  function frame(now){if(platformPaused){frameId=0;return;}const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();frameId=requestAnimationFrame(frame);}\n  function handlePlatformPause(){platformPaused=true;pausedByPlatform=state.active&&!state.paused;if(pausedByPlatform)togglePause(true);if(frameId){cancelAnimationFrame(frameId);frameId=0;}if(audioCtx?.state==='running')audioCtx.suspend().catch(()=>{});}\n  function handlePlatformResume(){platformPaused=false;if(pausedByPlatform)togglePause(false);pausedByPlatform=false;last=performance.now();if(audioCtx&&!fxMuted&&(!window.PulsePlatform?.inPlayables||window.PulsePlatform.systemAudioEnabled)&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});if(!frameId)frameId=requestAnimationFrame(frame);}",
              'final frame loop')
          t = replace_once(t,
              "  ui.mute?.addEventListener('click',()=>{if(!state.active)return;fxMuted=ui.mute.getAttribute('aria-pressed')==='true';});",
              "  ui.mute?.addEventListener('click',()=>{fxMuted=ui.mute.getAttribute('aria-pressed')==='true';});",
              'final FX preference')
          t = replace_once(t,
              "  window.addEventListener('pulse:system-pause',()=>{if(state.active&&!state.paused)togglePause(true);});\n  window.addEventListener('pulse:system-resume',()=>{if(state.active&&state.paused)togglePause(false);});\n  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.active&&!state.paused)togglePause(true);});",
              "  window.addEventListener('pulse:system-pause',handlePlatformPause);\n  window.addEventListener('pulse:system-resume',handlePlatformResume);\n  window.addEventListener('pulse:system-audio',event=>{const enabled=Boolean(event.detail?.enabled);if(!enabled&&audioCtx?.state==='running')audioCtx.suspend().catch(()=>{});else if(enabled&&!platformPaused&&!fxMuted&&audioCtx?.state==='suspended')audioCtx.resume().catch(()=>{});});",
              'final platform listeners')
          t = replace_once(t,
              "  requestAnimationFrame(frame);\n})();",
              "  frameId=requestAnimationFrame(frame);\n})();",
              'final initial frame')
          p.write_text(t, encoding='utf-8')

          # --- Adaptive music --------------------------------------------------------
          p = Path('music.js')
          t = p.read_text(encoding='utf-8')
          t = replace_once(t,
              "  let started = false;\n  let musicMuted = false;",
              "  let started = false;\n  let musicMuted = false;\n  let platformPaused = false;",
              'music platform var')
          t = replace_once(t,
              "  function isGameAudible() {\n    if (!started || musicMuted || document.hidden) return false;",
              "  function isGameAudible() {\n    if (!started || musicMuted || platformPaused) return false;\n    if (window.PulsePlatform?.inPlayables && !window.PulsePlatform.systemAudioEnabled) return false;",
              'music audible guard')
          t = replace_once(t,
              "  function start() {\n    if (!init()) return;\n    started = true;\n    if (ctx.state === 'suspended') ctx.resume();\n    if (!timer) {\n      nextStepTime = ctx.currentTime + .08;\n      step = 0;\n      timer = setInterval(schedule, 35);\n    }\n    updateMaster(true);\n  }",
              "  function startScheduler() {\n    if (!ctx || timer || platformPaused) return;\n    nextStepTime = ctx.currentTime + .08;\n    timer = setInterval(schedule, 35);\n  }\n\n  function start() {\n    if (!init()) return;\n    started = true;\n    step = 0;\n    if (ctx.state === 'suspended') ctx.resume().catch(() => {});\n    startScheduler();\n    updateMaster(true);\n  }",
              'music scheduler')
          t = replace_once(t,
              "  document.getElementById('pauseBtn')?.addEventListener('click', () => setTimeout(() => updateMaster(), 0));\n  document.getElementById('quitBtn')?.addEventListener('click', () => setTimeout(() => updateMaster(), 0));\n  document.addEventListener('visibilitychange', () => updateMaster());",
              "  document.getElementById('pauseBtn')?.addEventListener('click', () => setTimeout(() => updateMaster(), 0));\n  document.getElementById('quitBtn')?.addEventListener('click', () => setTimeout(() => updateMaster(), 0));\n  window.addEventListener('pulse:system-pause', () => {\n    platformPaused = true;\n    if (timer) { clearInterval(timer); timer = null; }\n    updateMaster(true);\n    if (ctx?.state === 'running') ctx.suspend().catch(() => {});\n  });\n  window.addEventListener('pulse:system-resume', () => {\n    platformPaused = false;\n    const resume = ctx && started && !musicMuted && (!window.PulsePlatform?.inPlayables || window.PulsePlatform.systemAudioEnabled) && ctx.state === 'suspended'\n      ? ctx.resume().catch(() => {})\n      : Promise.resolve();\n    Promise.resolve(resume).finally(() => { startScheduler(); updateMaster(true); });\n  });\n  window.addEventListener('pulse:system-audio', event => {\n    const enabled = Boolean(event.detail?.enabled);\n    if (!enabled) { updateMaster(true); if (ctx?.state === 'running') ctx.suspend().catch(() => {}); }\n    else if (!platformPaused && started && !musicMuted && ctx?.state === 'suspended') {\n      ctx.resume().catch(() => {}).finally(() => { startScheduler(); updateMaster(true); });\n    }\n  });",
              'music visibility listener')
          p.write_text(t, encoding='utf-8')

          # --- Playables-only UI -----------------------------------------------------
          p = Path('bootstrap.js')
          t = p.read_text(encoding='utf-8')
          t = replace_once(t,
              "  const KEYS = ['pulseBest', 'pulseRanks'];",
              "  const KEYS = ['pulseBest', 'pulseRanks'];\n\n  if (window.PulsePlatform?.inPlayables) {\n    document.documentElement.classList.add('youtube-playables');\n    const quit = document.getElementById('quitBtn');\n    if (quit) {\n      quit.hidden = true;\n      quit.style.display = 'none';\n      quit.setAttribute('aria-hidden', 'true');\n      quit.tabIndex = -1;\n    }\n  }",
              'bootstrap Playables UI')
          p.write_text(t, encoding='utf-8')

          # --- Save-before-pause ordering -------------------------------------------
          p = Path('platform.js')
          t = p.read_text(encoding='utf-8')
          t = replace_once(t,
              "    window.ytgame.system.onPause(() => {\n      systemPaused = true;\n      dispatch('pulse:system-pause');\n      scheduleSave(true);\n    });",
              "    window.ytgame.system.onPause(() => {\n      systemPaused = true;\n      scheduleSave(true);\n      dispatch('pulse:system-pause');\n    });",
              'platform pause ordering')
          p.write_text(t, encoding='utf-8')

      - name: Syntax and compliance sanity checks
        run: |
          node --check game-v3.js
          node --check final-act.js
          node --check music.js
          node --check bootstrap.js
          node --check platform.js
          ! grep -R "visibilitychange" --include='*.js' .
          ! grep -R "document.hidden" --include='*.js' .
          grep -q "systemAudioEnabled" music.js
          grep -q "systemAudioEnabled" game-v3.js
          grep -q "systemAudioEnabled" final-act.js

      - name: Commit hardening
        run: |
          git config user.name "Project Pulse Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add game-v3.js final-act.js music.js bootstrap.js platform.js
          git diff --cached --quiet && exit 0
          git commit -m "Harden YouTube Playables lifecycle and audio [playables-hardening-applied]"
          git push
