name: Finalize Playables lifecycle once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[apply-playables-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply lifecycle finalizer
        run: python .github/scripts/finalize_playables.py

      - name: Syntax and lifecycle checks
        run: |
          for f in platform.js loader.js bootstrap.js audio-unlock.js game-v3.js music.js polish.js final-act.js progression-final.js rift-tutorial.js; do node --check "$f"; done
          ! grep -R -n "visibilitychange" --include='*.js' .
          ! grep -R -n "document.hidden" --include='*.js' .
          grep -q "pulse-system-paused" platform.js
          grep -q "platformAllowsAudio" audio-unlock.js
          grep -q "pulse:system-pause" rift-tutorial.js
          grep -q "pulse:system-pause" polish.js
          grep -q "YOUTUBE_PLAYABLES_PAUSE_FREEZE" styles.css

      - name: Commit final lifecycle hardening
        run: |
          git config user.name "Project Pulse Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio-unlock.js bootstrap.js game-v3.js final-act.js polish.js rift-tutorial.js progression-final.js platform.js styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Playables pause and audio lifecycle [playables-finalize-applied]"
          git push
