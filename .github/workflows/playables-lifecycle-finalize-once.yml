name: Finalize Playables lifecycle once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[apply-playables-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize lifecycle handling
        shell: python
        run: |
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # Audio unlock must never override YouTube pause/mute.
          p = Path('audio-unlock.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "  const contexts = new Set();\n",
              "  const contexts = new Set();\n\n  function platformAllowsAudio() {\n    const platform = window.PulsePlatform;\n    return !platform?.inPlayables || (!platform.systemPaused && platform.systemAudioEnabled);\n  }\n",
              'audio allow gate')
          t = rep(t,
              "  function unlockContext(context) {\n    if (!context || context.state === 'closed') return;",
              "  function unlockContext(context) {\n    if (!platformAllowsAudio() || !context || context.state === 'closed') return;",
              'audio unlock guard')
          t = rep(t,
              "  function onUserGesture() {\n    // Resume contexts that already exist, then run again after the current\n    // gesture finishes so contexts created by Start/Continue are included.\n    unlockAll();\n    queueMicrotask(unlockAll);\n  }",
              "  function suspendAll() {\n    contexts.forEach(context => {\n      if (context?.state === 'running') {\n        try { context.suspend().catch(() => {}); } catch (_) {}\n      }\n    });\n  }\n\n  function onUserGesture() {\n    if (!platformAllowsAudio()) return;\n    // Resume contexts that already exist, then run again after the current\n    // gesture finishes so contexts created by Start/Continue are included.\n    unlockAll();\n    queueMicrotask(() => { if (platformAllowsAudio()) unlockAll(); });\n  }",
              'audio user gesture')
          t = rep(t,
              "  document.addEventListener('keydown', onUserGesture, true);\n\n  window.PulseAudioUnlock = {",
              "  document.addEventListener('keydown', onUserGesture, true);\n  window.addEventListener('pulse:system-pause', suspendAll);\n  window.addEventListener('pulse:system-audio', event => { if (!event.detail?.enabled) suspendAll(); });\n\n  window.PulseAudioUnlock = {",
              'audio lifecycle listeners')
          p.write_text(t, encoding='utf-8')

          # Block user input at capture phase while YouTube says paused.
          p = Path('bootstrap.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "    if (quit) {\n      quit.hidden = true;\n      quit.style.display = 'none';\n      quit.setAttribute('aria-hidden', 'true');\n      quit.tabIndex = -1;\n    }\n  }",
              "    if (quit) {\n      quit.hidden = true;\n      quit.style.display = 'none';\n      quit.setAttribute('aria-hidden', 'true');\n      quit.tabIndex = -1;\n    }\n\n    for (const type of ['pointerdown', 'pointerup', 'click', 'touchstart', 'touchend', 'keydown', 'keyup']) {\n      document.addEventListener(type, event => {\n        if (!window.PulsePlatform?.systemPaused) return;\n        event.preventDefault();\n        event.stopImmediatePropagation();\n      }, { capture: true, passive: false });\n    }\n  }",
              'bootstrap input freeze')
          p.write_text(t, encoding='utf-8')

          # Stage banners must not keep timers alive while YouTube is paused.
          p = Path('game-v3.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "  function handlePlatformPause() {\n    platformPaused = true;\n    pausedByPlatform = state.running && !state.paused;\n    if (pausedByPlatform) togglePause(true);\n    if (frameId) { cancelAnimationFrame(frameId); frameId = 0; }\n    if (audioCtx?.state === 'running') audioCtx.suspend().catch(() => {});\n  }",
              "  function handlePlatformPause() {\n    platformPaused = true;\n    pausedByPlatform = state.running && !state.paused;\n    if (pausedByPlatform) togglePause(true);\n    clearTimeout(bannerTimeout);\n    bannerTimeout = 0;\n    ui.banner?.classList.remove('show');\n    if (frameId) { cancelAnimationFrame(frameId); frameId = 0; }\n    if (audioCtx?.state === 'running') audioCtx.suspend().catch(() => {});\n  }",
              'game-v3 pause timers')
          p.write_text(t, encoding='utf-8')

          # Final act stage/act overlays also stop completely on platform pause.
          p = Path('final-act.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "  let last = performance.now();\n  let bannerTimer = 0;\n  let audioCtx = null;",
              "  let last = performance.now();\n  let bannerTimer = 0;\n  let actOverlayTimer = 0;\n  let audioCtx = null;",
              'final act timer var')
          t = rep(t,
              "    overlay.classList.add('show');\n    setTimeout(()=>overlay.classList.remove('show'),1900);",
              "    overlay.classList.add('show');\n    clearTimeout(actOverlayTimer);\n    actOverlayTimer=setTimeout(()=>overlay.classList.remove('show'),1900);",
              'final act overlay timer')
          t = rep(t,
              "  function handlePlatformPause(){platformPaused=true;pausedByPlatform=state.active&&!state.paused;if(pausedByPlatform)togglePause(true);if(frameId){cancelAnimationFrame(frameId);frameId=0;}if(audioCtx?.state==='running')audioCtx.suspend().catch(()=>{});}",
              "  function handlePlatformPause(){platformPaused=true;pausedByPlatform=state.active&&!state.paused;if(pausedByPlatform)togglePause(true);clearTimeout(bannerTimer);clearTimeout(actOverlayTimer);bannerTimer=0;actOverlayTimer=0;ui.banner?.classList.remove('show');document.querySelector('.act-overlay')?.classList.remove('show');if(frameId){cancelAnimationFrame(frameId);frameId=0;}if(audioCtx?.state==='running')audioCtx.suspend().catch(()=>{});}",
              'final pause timers')
          p.write_text(t, encoding='utf-8')

          # Cosmetic polish timers are disabled/cleared in Playables pause state.
          p = Path('polish.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "  setInterval(mirrorProgress, 1000);\n  window.addEventListener('pagehide', mirrorProgress);\n  window.addEventListener('beforeunload', mirrorProgress);",
              "  if (!window.PulsePlatform?.inPlayables) {\n    setInterval(mirrorProgress, 1000);\n    window.addEventListener('pagehide', mirrorProgress);\n    window.addEventListener('beforeunload', mirrorProgress);\n  }",
              'polish mirror timer')
          t = rep(t,
              "  let lastAct = '';\n  let actTimer = null;",
              "  let lastAct = '';\n  let actTimer = null;\n  let platformPaused = false;",
              'polish platform var')
          t = rep(t,
              "  function maybeShowAct() {\n    const n = stageNumber();",
              "  function maybeShowAct() {\n    if (platformPaused) return;\n    const n = stageNumber();",
              'polish act guard')
          t = rep(t,
              "  startButtons.forEach(btn => btn.addEventListener('click', () => {\n    clearTimeout(guideTimer);",
              "  startButtons.forEach(btn => btn.addEventListener('click', () => {\n    if (platformPaused) return;\n    clearTimeout(guideTimer);",
              'polish guide guard')
          t = rep(t,
              "  window.addEventListener('keydown', e => {\n    if ([' ', 'x', 'w', 'arrowup'].includes(e.key.toLowerCase())) tutorial.classList.remove('show');\n  });\n\n  if ('matchMedia' in window) {",
              "  window.addEventListener('keydown', e => {\n    if (platformPaused) return;\n    if ([' ', 'x', 'w', 'arrowup'].includes(e.key.toLowerCase())) tutorial.classList.remove('show');\n  });\n\n  window.addEventListener('pulse:system-pause', () => {\n    platformPaused = true;\n    clearTimeout(actTimer); actTimer = null;\n    clearTimeout(guideTimer); guideTimer = null;\n    actOverlay.classList.remove('show');\n    tutorial.classList.remove('show');\n  });\n  window.addEventListener('pulse:system-resume', () => { platformPaused = false; });\n\n  if ('matchMedia' in window) {",
              'polish lifecycle')
          p.write_text(t, encoding='utf-8')

          # Tutorial countdowns freeze and continue from the same number after resume.
          p = Path('rift-tutorial.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "  let activeStage = 0;\n  let countdownTimer = null;\n  const seen = new Set();",
              "  let activeStage = 0;\n  let countdownTimer = null;\n  let finishTimer = null;\n  let platformPaused = false;\n  let currentCount = 0;\n  let currentInterval = 0;\n  const seen = new Set();",
              'tutorial lifecycle vars')
          t = rep(t,
              "  function finishTutorial(stage) {\n    clearInterval(countdownTimer);\n    countdownTimer = null;",
              "  function finishTutorial(stage) {\n    clearInterval(countdownTimer);\n    clearTimeout(finishTimer);\n    countdownTimer = null;\n    finishTimer = null;",
              'tutorial finish timers')
          old_block = """    let count = tutorial.count;
    countNode.textContent = String(count);
    overlay.classList.add('show');

    const interval = stage === 9 ? 850 : 650;
    countdownTimer = setInterval(() => {
      count -= 1;
      if (count > 0) {
        countNode.textContent = String(count);
        return;
      }
      clearInterval(countdownTimer);
      countdownTimer = null;
      countNode.textContent = 'GO';
      setTimeout(() => finishTutorial(stage), stage === 9 ? 340 : 260);
    }, interval);"""
          new_block = """    currentCount = tutorial.count;
    currentInterval = stage === 9 ? 850 : 650;
    countNode.textContent = String(currentCount);
    overlay.classList.add('show');
    startCountdown(stage);"""
          t = rep(t, old_block, new_block, 'tutorial countdown body')
          marker = "  function showTutorial(stage) {\n"
          helper = """  function startCountdown(stage) {
    if (platformPaused || activeStage !== stage) return;
    clearInterval(countdownTimer);
    clearTimeout(finishTimer);
    countdownTimer = null;
    finishTimer = null;
    if (currentCount <= 0) {
      countNode.textContent = 'GO';
      finishTimer = setTimeout(() => finishTutorial(stage), stage === 9 ? 340 : 260);
      return;
    }
    countdownTimer = setInterval(() => {
      currentCount -= 1;
      if (currentCount > 0) {
        countNode.textContent = String(currentCount);
        return;
      }
      clearInterval(countdownTimer);
      countdownTimer = null;
      countNode.textContent = 'GO';
      finishTimer = setTimeout(() => finishTutorial(stage), stage === 9 ? 340 : 260);
    }, currentInterval);
  }

"""
          if marker not in t: raise SystemExit('Missing tutorial show marker')
          t = t.replace(marker, helper + marker, 1)
          t = rep(t,
              "    if (stage !== 9 && TUTORIALS[stage]) setTimeout(() => showTutorial(stage), 60);",
              "    if (stage !== 9 && TUTORIALS[stage]) showTutorial(stage);",
              'tutorial stage delay')
          t = rep(t,
              "  const observer = new MutationObserver(detectStage);\n  if (stageLabel) observer.observe(stageLabel, { childList:true, characterData:true, subtree:true });\n  reinforceHint();",
              "  const observer = new MutationObserver(detectStage);\n  if (stageLabel) observer.observe(stageLabel, { childList:true, characterData:true, subtree:true });\n  window.addEventListener('pulse:system-pause', () => {\n    platformPaused = true;\n    clearInterval(countdownTimer); countdownTimer = null;\n    clearTimeout(finishTimer); finishTimer = null;\n  });\n  window.addEventListener('pulse:system-resume', () => {\n    platformPaused = false;\n    if (activeStage) startCountdown(activeStage);\n  });\n  reinforceHint();",
              'tutorial pause listeners')
          p.write_text(t, encoding='utf-8')

          # System audio is a gate, not a rewrite of the player's Music/FX preferences.
          p = Path('progression-final.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "  let act2Handled = false;\n  let forcedMusic = false;\n  let forcedFx = false;\n  let applyingSystemAudio = false;",
              "  let act2Handled = false;",
              'progression audio vars')
          t = rep(t,
              "  function persistAudioSettings() {\n    if (applyingSystemAudio) return;\n    const next = {",
              "  function persistAudioSettings() {\n    const next = {",
              'progression persist gate')
          old_audio = """  function applySystemAudio(enabled) {
    if (!musicBtn || !fxBtn) return;
    applyingSystemAudio = true;
    if (!enabled) {
      if (musicBtn.getAttribute('aria-pressed') !== 'true') { forcedMusic = true; musicBtn.click(); }
      if (fxBtn.getAttribute('aria-pressed') !== 'true') { forcedFx = true; fxBtn.click(); }
    } else {
      if (forcedMusic && musicBtn.getAttribute('aria-pressed') === 'true') musicBtn.click();
      if (forcedFx && fxBtn.getAttribute('aria-pressed') === 'true') fxBtn.click();
      forcedMusic = false; forcedFx = false;
    }
    applyingSystemAudio = false;
  }"""
          new_audio = """  function applySystemAudio(enabled) {
    document.documentElement.classList.toggle('pulse-system-muted', !enabled);
  }"""
          t = rep(t, old_audio, new_audio, 'progression system audio')
          t = rep(t,
              "  musicBtn?.addEventListener('click', () => setTimeout(persistAudioSettings, 0));\n  fxBtn?.addEventListener('click', () => setTimeout(persistAudioSettings, 0));",
              "  musicBtn?.addEventListener('click', persistAudioSettings);\n  fxBtn?.addEventListener('click', persistAudioSettings);",
              'progression setting timers')
          p.write_text(t, encoding='utf-8')

          # Platform pause class freezes CSS animations/transitions too.
          p = Path('platform.js')
          t = p.read_text(encoding='utf-8')
          t = rep(t,
              "      systemAudioEnabled = Boolean(enabled);\n      window.__PULSE_SYSTEM_AUDIO__ = systemAudioEnabled;\n      dispatch('pulse:system-audio', { enabled: systemAudioEnabled });",
              "      systemAudioEnabled = Boolean(enabled);\n      window.__PULSE_SYSTEM_AUDIO__ = systemAudioEnabled;\n      document.documentElement.classList.toggle('pulse-system-muted', !systemAudioEnabled);\n      dispatch('pulse:system-audio', { enabled: systemAudioEnabled });",
              'platform audio class')
          t = rep(t,
              "    window.ytgame.system.onPause(() => {\n      systemPaused = true;\n      scheduleSave(true);\n      dispatch('pulse:system-pause');\n    });\n\n    window.ytgame.system.onResume(() => {\n      systemPaused = false;\n      dispatch('pulse:system-resume');\n    });",
              "    window.ytgame.system.onPause(() => {\n      systemPaused = true;\n      document.documentElement.classList.add('pulse-system-paused');\n      scheduleSave(true);\n      dispatch('pulse:system-pause');\n    });\n\n    window.ytgame.system.onResume(() => {\n      systemPaused = false;\n      document.documentElement.classList.remove('pulse-system-paused');\n      dispatch('pulse:system-resume');\n    });",
              'platform pause class')
          t = rep(t,
              "    window.__PULSE_SYSTEM_AUDIO__ = systemAudioEnabled;\n\n    window.ytgame.system.onAudioEnabledChange",
              "    window.__PULSE_SYSTEM_AUDIO__ = systemAudioEnabled;\n    document.documentElement.classList.toggle('pulse-system-muted', !systemAudioEnabled);\n\n    window.ytgame.system.onAudioEnabledChange",
              'platform initial audio class')
          p.write_text(t, encoding='utf-8')

          # Stop CSS-driven rendering while YouTube is paused.
          p = Path('styles.css')
          t = p.read_text(encoding='utf-8')
          marker = '/* YOUTUBE_PLAYABLES_PAUSE_FREEZE */'
          if marker not in t:
              t += "\n\n/* YOUTUBE_PLAYABLES_PAUSE_FREEZE */\n.youtube-playables.pulse-system-paused *,\n.youtube-playables.pulse-system-paused *::before,\n.youtube-playables.pulse-system-paused *::after {\n  animation-play-state: paused !important;\n  transition: none !important;\n}\n.youtube-playables.pulse-system-paused body { pointer-events: none !important; }\n"
          p.write_text(t, encoding='utf-8')

      - name: Syntax and lifecycle checks
        run: |
          for f in platform.js loader.js bootstrap.js audio-unlock.js game-v3.js music.js polish.js final-act.js progression-final.js rift-tutorial.js; do node --check "$f"; done
          ! grep -R -n "visibilitychange" --include='*.js' .
          ! grep -R -n "document.hidden" --include='*.js' .
          grep -q "pulse-system-paused" platform.js
          grep -q "platformAllowsAudio" audio-unlock.js
          grep -q "pulse:system-pause" rift-tutorial.js
          grep -q "pulse:system-pause" polish.js
          grep -q "YOUTUBE_PLAYABLES_PAUSE_FREEZE" styles.css

      - name: Commit final lifecycle hardening
        run: |
          git config user.name "Project Pulse Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio-unlock.js bootstrap.js game-v3.js final-act.js polish.js rift-tutorial.js progression-final.js platform.js styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Playables pause and audio lifecycle [playables-finalize-applied]"
          git push
