name: Package YouTube Playables submission kit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-playables]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean game package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist package
          mkdir -p dist package

          files=(
            index.html
            platform.js
            loader.js
            audio-unlock.js
            bootstrap.js
            game-v3.js
            final-act.js
            music.js
            polish.js
            progression-final.js
            rift-tutorial.js
            styles.css
            polish.css
            final.css
          )

          for f in "${files[@]}"; do
            test -f "$f"
            cp "$f" package/
          done

          # YouTube expects the entry point at ZIP root.
          test -f package/index.html

          (
            cd package
            zip -9 -r ../dist/Project-Pulse-YouTube-Playable.zip . >/dev/null
          )

          cat > dist/Project-Pulse-Submission-Info.txt <<'EOF'
          PROJECT PULSE — YOUTUBE PLAYABLES SUBMISSION INFO

          Title: Project Pulse
          Version: 1.0 Release Candidate
          Developer role: Independent Game Developer / Creator
          Genre: Action / Runner / Arcade
          Audience: General 13+
          Platform: HTML5 / YouTube Playables
          Public test build: https://rbf200611.github.io/project-pulse-playables/

          SHORT DESCRIPTION
          A fast neon action runner where players jump, switch between two realities with Pulse, build combos, trigger Overdrive, defeat bosses, and survive a 16-stage campaign plus Endless Mode.

          LONG DESCRIPTION
          Project Pulse is an original HTML5 action runner built around a reality-switching mechanic. Players automatically run through a collapsing neon world while using Jump and Pulse to avoid hazards, switch between two realities, chain precise timing, build Overdrive, defeat bosses, and progress through a 16-stage campaign with increasing speed and difficulty. The game also includes Endless Mode, adaptive procedural music, touch controls for mobile, keyboard controls for desktop, persistent progression, ranks, and replay-focused scoring. It is designed to be quick to learn, challenging to master, and suitable for short YouTube Playables sessions.

          CORE CONTROLS
          Desktop:
          - Space / W / Arrow Up: Jump
          - X: Pulse
          - P: Pause

          Mobile:
          - Left touch control: Jump
          - Right touch control: Pulse

          CORE FEATURES
          - 16-stage campaign
          - Endless Mode
          - Two-reality Pulse mechanic
          - Boss encounters
          - Overdrive / combo system
          - Adaptive procedural soundtrack
          - Mobile touch + desktop keyboard controls
          - Persistent unlocks, ranks, settings and best score
          - YouTube Playables SDK integration for save, score, audio and lifecycle

          PUBLIC REVIEW NOTES
          - Gameplay is frozen for submission except for certification fixes.
          - YouTube system pause/resume is authoritative in Playables mode.
          - YouTube system mute gates all game audio in Playables mode.
          - Quit-to-menu is hidden inside the YouTube Playables environment.
          - Browser test build remains available at the public link above.

          SUBMISSION STATUS
          - Public Playables Interest Form submitted.
          - Developer Portal access pending YouTube onboarding.
          - Package is prepared for Developer Portal upload and Test Suite review.
          - This build is not yet YouTube-certified or approved.
          EOF

          cat > dist/Project-Pulse-Package-Manifest.txt <<EOF
          Project Pulse YouTube Playables package
          Source commit: ${GITHUB_SHA}
          Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          ZIP root files:
          $(printf '%s\n' "${files[@]}")

          ZIP size:
          $(stat -c '%s bytes' dist/Project-Pulse-YouTube-Playable.zip)

          SHA-256:
          $(sha256sum dist/Project-Pulse-YouTube-Playable.zip)
          EOF

          unzip -l dist/Project-Pulse-YouTube-Playable.zip
          bytes=$(stat -c '%s' dist/Project-Pulse-YouTube-Playable.zip)
          test "$bytes" -lt 15728640

      - name: Upload submission kit
        uses: actions/upload-artifact@v4
        with:
          name: project-pulse-submission-kit
          path: dist/
          if-no-files-found: error
          retention-days: 90
