name: Apply campaign duration tune once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tune:
    if: contains(github.event.head_commit.message, '[apply-duration-tune]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extend campaign pacing
        shell: python
        run: |
          from pathlib import Path
          import re

          LENGTH_FACTOR = 1.15
          X_FACTOR = 1.12
          MARKER = 'CAMPAIGN_DURATION_TUNE_V1'

          for filename in ('game-v3.js', 'final-act.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if MARKER in text:
                  print(f'{filename}: already tuned')
                  continue

              text = text.replace("  'use strict';", "  'use strict';\n\n  // CAMPAIGN_DURATION_TUNE_V1: +15% stage distance, +12% obstacle spacing.", 1)
              text = re.sub(
                  r'(length:\s*)(\d+)',
                  lambda m: m.group(1) + str(round(int(m.group(2)) * LENGTH_FACTOR)),
                  text
              )
              text = re.sub(
                  r'\b(O|C|B|D|E|R|S)\((\d+)',
                  lambda m: f"{m.group(1)}({round(int(m.group(2)) * X_FACTOR)}",
                  text
              )
              path.write_text(text, encoding='utf-8')
              print(f'{filename}: tuned')
      - name: Commit tuning
        run: |
          git config user.name "Project Pulse Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add game-v3.js final-act.js
          git diff --cached --quiet && exit 0
          git commit -m "Extend campaign stage duration [duration-tune-applied]"
          git push
